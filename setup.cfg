# Project metadata, dependencies and build configuration live in pyproject.toml.
# Only tools without pyproject.toml support are configured here.

[flake8]
max-line-length = 100
max-complexity = 18
select = B,C,E,F,W,T4,B9
extend-ignore = E203, W503
ignore = E203,E226,E251,E501,E722,F821,W503,W605
per-file-ignores =
    __init__.py:F401,F403,F405
    test/*:F403,F405
exclude =
