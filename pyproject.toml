[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyBigKinds"
dynamic = ["version"]
description = "BigKinds Data Analysis Toolkit for python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sorrychoe" }]
keywords = ["Journalism", "Preprocessing-data", "Text-mining", "BigKinds"]
dependencies = [
    "matplotlib>=3.5.3",
    "pandas>=2,<3",
    "wordcloud>=1.8.2.2",
    "scikit-learn>=1.0.0,<2",
    "tomotopy>=0.14.0",
    "openpyxl>=3.1.2",
    "mlxtend>=0.22.0,<0.24",
]

[project.optional-dependencies]
dev = [
    "build>=0.7",
    "flake8>=3.9",
    "isort>=5.7",
    "pre-commit>=3",
    "pylint>=3.2.0",
    "pytest>=7",
]

[project.urls]
"Source Code" = "https://github.com/sorrychoe/pyBigKinds"
"Bug Tracker" = "https://github.com/sorrychoe/pyBigKinds/issues"

[tool.setuptools]
packages = ["pyBigKinds"]

[tool.setuptools.dynamic]
version = { attr = "pyBigKinds._version.__version__" }

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
