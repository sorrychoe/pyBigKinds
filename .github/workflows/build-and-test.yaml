name: build-test

on:
  pull_request:
    branches: ["develop", "release"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        make init
        make install
    - name: Test with pytest
      run: |
        make test
    - name: test with build
      run: |
        make wheel
